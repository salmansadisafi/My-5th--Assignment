<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>GitHub Issues Tracker</title>
</head>

<body class="bg-gray-50">

    <nav class="flex items-center justify-between px-12 py-4 bg-white border-b border-slate-200">
        <div class="flex items-center gap-2 font-bold text-xl">
            <img src="./assets/github-logo.png" width="40">
            <span>GitHub Issues Tracker</span>
        </div>

        <div class="flex gap-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="Search issues..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg w-64 focus:outline-none">
            </div>
            <button id="search-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg">Search</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto mt-10 px-8">
        <div class="bg-white p-2 rounded-xl border border-slate-200 inline-flex gap-2">
            <button id="tab-all" class="px-8 py-2 bg-indigo-600 text-white rounded-lg font-medium">All</button>
            <button id="tab-open" class="px-8 py-2 text-slate-500 rounded-lg font-medium">Open</button>
            <button id="tab-closed" class="px-8 py-2 text-slate-500 rounded-lg font-medium">Closed</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto mt-6 mb-20 px-8">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            
            <div class="p-8 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center">
                        <img src="./assets/Aperture.png">
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold"><span id="issue-count">0</span> Issues</h2>
                        <p class="text-slate-400">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex gap-6 font-medium">
                    <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-emerald-500"></div> Open</span>
                    <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-purple-500"></div> Closed</span>
                </div>
            </div>
             <div id="loader" class="text-center p-10 font-bold text-indigo-600">
             Loading Issues...
             </div>

             <div id="ISSUES-LIST" class="p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 bg-slate-50/50">
                
             </div>
             
        </div>
    </main>

    <div id="issue-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl max-w-md w-full relative">
            <h3 class="text-xl font-bold mb-4" id="modal-title">Issue Details</h3>
            <div id="modal-body" class="space-y-2 text-sm text-slate-600">
                </div>
            <button id="close-modal-btn" class="mt-6 bg-red-500 text-white px-4 py-2 rounded">Close</button>
        </div>
    </div>

    
    
    <script src="./script/main.js"></script>
</body>
</html>
